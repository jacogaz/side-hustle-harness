# Side hustle global configuration (SPEC.md section 6).
# Shared by the whole team; change it through a commit to this repo.
# Values marked "confirmed default" are the defaults confirmed by the owner.
# Values marked "PROPOSED DEFAULT" are placeholders awaiting owner confirmation.

# Number of Doing <-> To Review loops before the task moves to Needs Info.
max_reviewer_attempts: 3            # confirmed default

# Hours without a heartbeat after which a task in Doing or To Review is orphaned
# and any polling agent releases it to Next.
heartbeat_timeout_hours: 2          # confirmed default

# Hours without an answer in Needs Info before the single reminder to the owner.
# If the reminder also gets no answer within the same time, the task is flagged
# "stalled" and the owner agent (or the owner) releases it to Next.
needs_info_timeout_hours: 24        # confirmed default

# Default budget per estimate size, as % of the weekly Claude usage limit.
# The create-task skill applies it when the owner gives an estimate but no budget.
default_budget_per_size:
  S: 2                              # confirmed default
  M: 5                              # confirmed default
  L: 10                             # confirmed default

# Minimal shared guidelines applied when the target repo defines no harness.
# Path relative to the root of this repo.
default_harness: harness/DEFAULT_HARNESS.md

# Shared side hustle channel. Every task thread lives here.
slack_channel:
  name: "#it5-iubenda-side-hustle"
  id: C0CGCT0CRMY

# Asana project where side hustle tasks live, and the gids of its sections.
asana_project:
  gid: "1220379119011503"
  sections:
    open: "1220379100159455"
    doing: "1220379121415094"
    to_review: "1220379100149619"
    qa_review: "1220378651843995"
    next: "1220379121354363"
    needs_info: "1220379034141540"
    done: "1220378955636623"
  # Custom fields holding Priority, Estimate, Budget and Last heartbeat
  # (templates/task-description.md). Budget is stored as a fraction: 0.05 = 5%.
  custom_fields:
    priority:
      gid: "1126953814702796"
      options: {High: "1126953814702797", Medium: "1126953814702798", Low: "1126953814702799"}
    estimate:
      gid: "1220385930092876"
      options: {S: "1220385930092877", M: "1220385930092878", L: "1220385930092879"}
    budget:
      gid: "1220385930092881"
    last_heartbeat:
      gid: "1220385930092883"

# Usage reporting (skills/usage-reporting/SKILL.md). Both numbers are estimates:
# Claude Code exposes neither the weekly limit nor a per-token price for subscriptions.
usage:
  weekly_limit_tokens_estimate: 50000000   # PROPOSED DEFAULT, an ESTIMATE of one user's weekly limit (not an official figure)
  price_usd_per_mtok: {}                   # PROPOSED DEFAULT: API-equivalent ESTIMATE per model, e.g. {"<model id>": 5}; empty = cost shows n/a
  ledger_task: "1220392106821888"          # "Side hustle ledger (system, do not pick up)", completed, in Done; holds the pledge records
